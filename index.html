<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دليل المدارس التابعة للإدارة العامة للتعليم بمنطقة مكة المكرمة</title>
<style>
:root{
  --navy:#173f67;--navy-deep:#071d35;--navy-mid:#0d2f52;--navy-soft:#e8eef4;
  --accent:#6f8fad;--accent-soft:#edf2f6;--ink:#0a2744;--muted:#5e7183;
  --bg:#0a2340;--card:#fbfaf6;--line:#d6dde3;--shadow:0 18px 50px rgba(2,18,35,.24)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Tahoma","Arial",sans-serif;background:linear-gradient(145deg,#06182d 0%,#0b2b4d 42%,#1d4d79 100%);color:var(--ink);min-height:100vh;background-attachment:fixed}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 88% 4%,rgba(118,157,192,.20),transparent 34%),radial-gradient(circle at 12% 22%,rgba(255,255,255,.07),transparent 30%),linear-gradient(180deg,rgba(255,255,255,.025),rgba(0,0,0,.08))}
.page{width:min(1180px,calc(100% - 28px));margin:auto;padding:22px 0 28px;position:relative;z-index:1}
.top-card{background:#fbfaf6;border:1px solid rgba(255,255,255,.28);border-radius:26px;box-shadow:var(--shadow);overflow:hidden;position:relative}
.top-card:before{content:"";display:block;height:6px;background:linear-gradient(90deg,var(--navy-deep),var(--navy),#7596b4)}
.brand-wrap{padding:20px 24px 12px;display:flex;justify-content:center;align-items:center;background:linear-gradient(180deg,#fffefb,#f8f6f0);border-bottom:1px solid #e5e3dc}
.brand-wrap img{width:min(820px,96%);height:auto;display:block;object-fit:contain}
.hero{padding:24px 28px 30px;text-align:center;background:linear-gradient(180deg,#fbfaf6 0%,#f5f3ed 100%)}
.hero h1{margin:0 auto;font-size:clamp(25px,3.35vw,40px);color:var(--navy-deep);font-weight:900;letter-spacing:-.45px;line-height:1.55;max-width:1000px}
.hero h1:after{content:"";display:block;width:92px;height:4px;margin:14px auto 0;border-radius:999px;background:linear-gradient(90deg,#7596b4,var(--navy-deep))}
.search-panel{margin-top:25px;background:linear-gradient(135deg,#071d35 0%,#0d2f52 55%,#1a4a75 100%);padding:22px;border-radius:22px;box-shadow:0 16px 34px rgba(2,18,35,.30);border:1px solid rgba(255,255,255,.16)}
.search-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.search-box{position:relative}
.search-box input{width:100%;height:60px;border:1px solid #d9dde0;border-radius:16px;padding:0 20px;font-size:18px;outline:none;color:var(--navy-deep);background:#fbfaf6;box-shadow:0 6px 18px rgba(0,0,0,.12);transition:.2s ease;font-weight:700}
.search-box input:focus{border-color:#7396b5;box-shadow:0 0 0 4px rgba(115,150,181,.20),0 8px 22px rgba(0,0,0,.12)}
.search-box input::placeholder{color:#788898}
.clear-btn{height:60px;border:1px solid rgba(255,255,255,.58);background:rgba(255,255,255,.10);color:#fff;padding:0 24px;border-radius:16px;font-weight:900;cursor:pointer;font-size:15px;transition:.2s ease}
.clear-btn:hover{background:rgba(255,255,255,.18);transform:translateY(-1px)}
.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.filters select{width:100%;background:#fbfaf6;color:var(--navy-deep);border:1px solid #d9dde0;border-radius:13px;padding:11px 13px;font-size:14px;outline:none;min-height:44px;font-weight:800;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.filters .static-filter{width:100%;background:#fbfaf6;color:var(--navy-deep);border:1px solid #d9dde0;border-radius:13px;padding:11px 13px;font-size:14px;min-height:44px;font-weight:800;box-shadow:0 4px 12px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center}
.filters select:focus{border-color:#7396b5;box-shadow:0 0 0 3px rgba(115,150,181,.18)}
.results{margin-top:20px}
.empty{background:#fbfaf6;border:1px dashed #9aacbd;border-radius:20px;padding:32px;text-align:center;color:var(--muted);font-weight:800;box-shadow:0 8px 22px rgba(2,18,35,.10)}
.result-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.school-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:19px 20px 20px;box-shadow:0 12px 28px rgba(2,18,35,.14);transition:.22s ease;position:relative;overflow:hidden}
.school-card:before{content:"";position:absolute;right:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,#0c3155,#7596b4)}
.school-card:after{content:"";position:absolute;left:-40px;top:-40px;width:120px;height:120px;border-radius:50%;background:rgba(13,47,82,.045);pointer-events:none}
.school-card:hover{transform:translateY(-3px);border-color:#aebdca;box-shadow:0 18px 38px rgba(2,18,35,.20)}
.school-name{font-size:20px;font-weight:900;color:var(--navy-deep);margin:0 0 13px;line-height:1.65;position:relative;z-index:1}
.id-badge{display:inline-flex;align-items:center;background:linear-gradient(135deg,#e9eef3,#f6f4ee);color:var(--navy-deep);padding:7px 11px;border:1px solid #cfd9e2;border-radius:10px;font-size:13px;font-weight:900;margin-bottom:13px}
.details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.detail{background:#f4f2ec;border:1px solid #dddcd6;border-radius:13px;padding:11px 12px;min-height:66px;transition:.18s ease}
.detail:hover{background:#efeee9;border-color:#c7d0d8}
.label{display:block;color:#405a72;font-size:12px;margin-bottom:5px;font-weight:800}
.value{display:block;color:#0a2744;font-size:14px;font-weight:900;line-height:1.5}
.match-count{margin:0 0 12px;color:var(--navy-deep);font-size:13px;font-weight:800;background:#fbfaf6;border:1px solid var(--line);display:inline-block;padding:7px 12px;border-radius:999px;box-shadow:0 5px 14px rgba(2,18,35,.08)}
.footer{text-align:center;color:#e5edf4;font-size:13px;padding:22px 4px 4px;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.footer strong{color:#ffffff;font-weight:900;letter-spacing:.1px}
mark{background:#dfeaf3;color:var(--navy-deep);border-radius:4px;padding:0 2px}
@media (max-width:760px){
 .page{width:min(100% - 16px,1180px);padding-top:10px}
 .top-card{border-radius:20px}
 .brand-wrap{padding:14px 10px 8px}
 .hero{padding:20px 14px 22px}
 .hero h1{font-size:clamp(22px,6.5vw,30px)}
 .search-panel{padding:14px;border-radius:17px;margin-top:18px}
 .search-row{grid-template-columns:1fr}
 .clear-btn{height:48px}
 .filters{grid-template-columns:1fr}
 .result-grid{grid-template-columns:1fr}
 .details{grid-template-columns:1fr 1fr}
 .school-name{font-size:18px}
}
@media (max-width:430px){.details{grid-template-columns:1fr}.search-box input{font-size:16px;height:56px}}
@media print{body{background:#fff}.page{width:100%;padding:0}.search-panel,.footer{display:none}.top-card{box-shadow:none;border:0}.result-grid{grid-template-columns:1fr 1fr}.school-card{break-inside:avoid}}
</style>
</head>

r":"بنات","school_type":"نهاري","study_time":"صباحي","source":"الشرق","page":6},{"ministry_no":"568721","school_name":"روضة المودة بمكة المكرمة","sector":"قطاع الشرق","stage":"رياض الأطفال","gender":"بنات","school_type":"نهاري","study_time":"صباحي","source":"الشرق","page":6},{"ministry_no":"056721","school_name":"روضة النجاح بمكة المكرمة","sector":"قطاع الشرق","stage":"رياض الأطفال","gender":"بنات","school_type":"نهاري","study_time":"صباحي","source":"الشرق","page":6},{"ministry_no":"389721","school_name":"روضة النرجس بمكة المكرمة","sector":"قطاع الشرق","stage":"رياض الأطفال","gender":"بنات","school_type":"نهاري","study_time":"صباحي","source":"الشرق","page":6},{"ministry_no":"468721","school_name":"روضة اليمانية بمكة المكرمة","sector":"قطاع الشرق","stage":"رياض الأطفال","gender":"بنات","school_type":"نهاري","study_time":"صباحي","source":"الشرق","page":6}];
const input=document.getElementById('searchInput');
const results=document.getElementById('results');
const sectorFilter=document.getElementById('sectorFilter');
const stageFilter=document.getElementById('stageFilter');
const genderFilter=document.getElementById('genderFilter');
const clearBtn=document.getElementById('clearBtn');

function norm(s){return (s||'').toString().toLowerCase().normalize('NFKD')
 .replace(/[ً-ٰٟ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[ـ\-–—]/g,' ').replace(/\s+/g,' ').trim();}
function uniq(field){return [...new Set(schools.map(x=>x[field]).filter(Boolean).filter(x=>x!=='—'))].sort((a,b)=>a.localeCompare(b,'ar'));}
function sectorKey(s){const n=norm(s);if(n.includes('الشمال'))return 'قطاع الشمال';if(n.includes('الجنوب'))return 'قطاع الجنوب';if(n.includes('الشرق'))return 'قطاع الشرق';if(n.includes('الغرب'))return 'قطاع الغرب';if(n.includes('بحره'))return 'بحرة';if(n.includes('الجموم'))return 'الجموم';return s||'';}
function fillSelect(el,vals){vals.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;el.appendChild(o);})}
fillSelect(stageFilter,['المرحلة الثانوية','المرحلة المتوسطة','المرحلة الابتدائية','رياض الأطفال'].filter(v=>schools.some(x=>x.stage===v)));fillSelect(genderFilter,uniq('gender'));
function esc(s){return (s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function highlight(text,q){if(!q)return esc(text); const nt=norm(text), nq=norm(q); if(!nq)return esc(text); const idx=nt.indexOf(nq); if(idx<0)return esc(text); return esc(text);}
function card(r){return `<article class="school-card">
  <h2 class="school-name">${esc(r.school_name)}</h2>
  <div class="id-badge">الرقم الوزاري: ${esc(r.ministry_no||'—')}</div>
  <div class="details">
    <div class="detail"><span class="label">القطاع</span><span class="value">${esc(r.sector||'—')}</span></div>
    <div class="detail"><span class="label">المرحلة</span><span class="value">${esc(r.stage||'—')}</span></div>
    <div class="detail"><span class="label">جنس المدرسة</span><span class="value">${esc(r.gender||'—')}</span></div>
    <div class="detail"><span class="label">نوع المدرسة</span><span class="value">${esc(r.school_type||'—')}</span></div>
    <div class="detail"><span class="label">وقت الدراسة</span><span class="value">${esc(r.study_time||'—')}</span></div>
    <div class="detail"><span class="label">المصدر</span><span class="value">تعليم مكة المكرمة</span></div>
  </div>
</article>`}
function render(){
 const q=input.value.trim(), nq=norm(q), sf=sectorFilter.value, st=stageFilter.value, gf=genderFilter.value;
 let list=schools.filter(r=>(!sf||sectorKey(r.sector)===sf)&&(!st||r.stage===st)&&(!gf||r.gender===gf));
 if(nq) list=list.filter(r=>norm(r.school_name).includes(nq));
 if(!q && !sf && !st && !gf){results.innerHTML='';return;}
 if(!list.length){results.innerHTML='<div class="empty">لم يتم العثور على مدرسة مطابقة. جرّب جزءًا من الاسم أو غيّر عوامل التصفية.</div>';return;}
 const limited=list.slice(0,80);
 results.innerHTML=`<p class="match-count">تم العثور على ${list.length} نتيجة${list.length>80?' — يتم عرض أول 80 نتيجة':''}</p><div class="result-grid">${limited.map(card).join('')}</div>`;
}
clearBtn.addEventListener('click',()=>{
  render();
  input.blur();
});
sectorFilter.addEventListener('change',render);
stageFilter.addEventListener('change',render);
genderFilter.addEventListener('change',render);
input.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    e.preventDefault();
    render();
    input.blur();
  }
});
render();
</script>
